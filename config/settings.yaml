# Show the "Past ISB recruiter" tag and filter on the website.
show_past_isb_recruiter: true

# Words removed from company names before matching (e.g. "Novartis Healthcare
# Pvt. Ltd. India" -> "novartis healthcare").
company_suffixes:
  - private limited
  - pvt ltd
  - pvt
  - private
  - limited
  - ltd
  - llp
  - inc
  - incorporated
  - corporation
  - corp
  - co
  - company
  - plc
  - gmbh
  - ag
  - sa
  - india
  - the

# Past ISB recruiter fuzzy match: at or above "accept" is tagged; between
# "review" and "accept" is logged for you to check, not tagged.
isb_match:
  accept: 93
  review: 85

# One-time backfill (changed 6 Nov 2026, Pranav: steps were taking too long).
# Jobs already saved are never removed by these; they only shape the steps still to run.
backfill:
  window_days: 14                    # steps still to run look back this many days (the first 33 used 30)
  skip_locations: ["Remote (India)"] # heaviest searches; the daily runs still cover them

# LinkedIn pacing (seconds between requests, plus random jitter).
linkedin:
  delay_seconds: 2.5
  min_delay_seconds: 1.5
  max_pages_per_search: 100     # 10 results per page, LinkedIn stops near 1,000
  blocks_before_stop: 4
  block_rest_minutes: 5         # after a push-back: rest 5, then 10, then 20 minutes
  rest_every_requests: 250      # and a break every 250 requests, before LinkedIn asks for one
  rest_minutes: 5
  offline_wait_minutes: 30     # internet down: wait this long for it, then fail the step (it runs again)

# Lever asks for at least 1 second between requests.
ats:
  delay_seconds: 1.0
  # Workday / Oracle: pages of 20-25 jobs read per company per run (newest first for Oracle)
  max_pages_big_boards: 25
  # Company careers sites read through their sitemap + Google Jobs tags (careers_site.py)
  careers_site:
    max_sitemaps: 6        # sitemap files read per site per run
    max_pages: 40          # job pages opened per site per run

# IIMjobs robots.txt asks for 10 seconds between requests. 50 jobs per page.
iimjobs:
  delay_seconds: 10
  max_pages_per_search: 20

# Indeed and Naukri (JobSpy). Naukri times out or asks for a captcha when pushed,
# so searches are spaced out, and a search that hit errors is tried once more
# after a longer wait. After `give_up_after` searches still failing, the source
# stops for this run (the next run catches up).
jobspy:
  delay_seconds: {indeed: 3, naukri: 8}
  retry_wait_seconds: 60
  give_up_after: 3
  naukri_page_delay_seconds: 4  # between Naukri job pages (plus 0-2 s jitter)
  naukri_short_description_words: 60  # open a Naukri job page only if its search summary is shorter

# Longest catch-up window if earlier runs failed.
max_window_days: 30

# Characters of each description kept for Claude (deleted after tagging).
description_chars: 2500
# Of those, at most this many from the "about the role" part; the rest is requirements.
role_chars: 1000
