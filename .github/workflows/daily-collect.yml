name: Daily collect

# Once a day at about 1 PM IST: collect new jobs from every source and save them
# to Supabase. Each source is its own job, all running side by side with up to 6 h
# each: one machine each for iimjobs, Indeed, Naukri and the careers pages, and
# LinkedIn split across 10 machines (machine K does every 10th search, starting at K). Jobs are saved after every search; a source that runs out of time stops
# just before GitHub's 6 h cut-off and the next day carries on from the same search.
# Each source (and each LinkedIn machine) catches up from its own last finished
# run, so a missed day is picked up the next time. Can also be started by hand from the
# Actions tab ("Run workflow").
#
# Nothing is committed back to the repo: job descriptions stay in Supabase only
# (the repo is public).

on:
  schedule:
    - cron: "23 7 * * *"        # 07:23 UTC = 12:53 PM IST (off the hour, fewer delays)
  workflow_dispatch:
    inputs:
      days:
        description: "Only the last N days (e.g. 1 for a 24-hour test). Leave empty for the normal catch-up."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-collect
  cancel-in-progress: false     # never two runs at once

jobs:
  collect:
    name: ${{ matrix.source }}${{ matrix.shard && format(' {0}/10', matrix.shard) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # one site failing never stops the others
      matrix:
        include:
          - source: iimjobs
          - source: indeed
          - source: naukri
          - source: ats
          - { source: linkedin, shard: 1 }
          - { source: linkedin, shard: 2 }
          - { source: linkedin, shard: 3 }
          - { source: linkedin, shard: 4 }
          - { source: linkedin, shard: 5 }
          - { source: linkedin, shard: 6 }
          - { source: linkedin, shard: 7 }
          - { source: linkedin, shard: 8 }
          - { source: linkedin, shard: 9 }
          - { source: linkedin, shard: 10 }
    timeout-minutes: 360          # GitHub's most for one job
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # Stop 20 min before the 6 h cut-off, so the run can note where to carry on.
      COLLECT_TIME_LIMIT_MINUTES: "340"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Collect
        env:
          DAYS: ${{ inputs.days }}
          SHARD: ${{ matrix.shard }}
        run: >-
          python -u -m collector.cli daily --sources ${{ matrix.source }}
          ${SHARD:+--shard "$SHARD/10"} ${DAYS:+--days "$DAYS"}
      - name: Summary on the run page
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY" || true
          import json, pathlib
          f = pathlib.Path("data/logs/runs.jsonl")
          if not f.exists():
              print("No run summary (the run stopped before the end).")
          else:
              run = json.loads(f.read_text().splitlines()[-1])
              print("| Source | Status | Found | Kept | New | Note |\n|---|---|---|---|---|---|")
              for name, s in run.items():
                  if isinstance(s, dict):
                      print(f"| {name} | {s['status']} | {s['found']} | {s['kept']} | {s['new']} | {s['error'] or ''} |")
          EOF
